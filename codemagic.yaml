workflows:
  ios-release:
    name: Roya & Arya - iOS App Store & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.royaarya.neonricochet"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Capacitor Sync iOS
        script: |
          npx cap sync ios

      - name: Set up code signing
        script: |
          # Automatically fetch signing certificates if Apple Integration is linked:
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create || echo "Profiles will be managed manually or automatically"
          keychain add-certificates || true
          xcode-project use-profiles || true

      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/clone/ios/App/build/**/*.ipa
      - "*.ipa"
